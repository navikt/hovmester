# docs/adr/, docs/GLOSSARY.md). Referanseimplementasjon: navikt/syfo-budstikka.
# Kombineres typisk med backend-collectionen; gjenbruker eksisterende skills
# der de finnes (grill-me, tdd, kafka-topic, ...).
